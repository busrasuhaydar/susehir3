<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
    <script>
        // ===================== AYARLAR (istemediğin özelliği false yap) =====================
        const FEATURES = {
            candles: true,       // suyun üzerinde yüzen mumlar
            pedestrians: false,  // (kaldırıldı)
            boats: true,         // tekneler
            seagulls: true,      // martılar
            fish: true,          // su altı balıkları
            clouds: true,        // bulutlar
            shadows: true,       // gerçek zamanlı gölgeler
            refraction: true     // gerçek su kırılması + derinlik (masaüstü)
        };
        // HAYALET / İSKELET KARAKTER: modelin hazır olduğunda .glb veya .gltf adresini buraya yaz.
        // Boş kaldıkça şehir ışıktan bir ruhla gezilir. Modeli arayüzdeki içe aktarma panelinden de yükleyebilirsin.
        const SPIRIT_MODEL_URL = '';
        // Cihaz sınıfı: telefon / tablet (iPadOS dahil, kendini Mac olarak tanıtsa da) ve "güvenli mod" (önceki açılışta grafik belleği
        // tükendiyse bir sonraki açılış otomatik olarak daha hafif ayarlarla başlar; sayfa kapanıp yeniden açılma döngüsü olmaz).
        const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1) || (typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 1100);
        // v3 · KADEMELİ GÜVENLİ MOD: 0 = normal, 1 = bir kademe hafif (bir kez grafik belleği tükendi), 2 = güvenli mod.
        const SAFE_LEVEL = (() => { try { return Math.max(0, Math.min(2, parseInt(sessionStorage.getItem('sucity.safe') || '0', 10) || 0)); } catch (e) { return 0; } })();
        const SAFE_MODE = SAFE_LEVEL >= 2;
        // v3 · CİHAZ KADEMESİ (0 zayıf telefon · 1 orta telefon · 2 güçlü telefon / zayıf masaüstü · 3 masaüstü).
        // deviceMemory + hardwareConcurrency + GPU adı + ekran; bu cihazda daha önce oturmuş kademe varsa oradan başlanır.
        const Q = (() => {
            const mem = navigator.deviceMemory || (IS_MOBILE ? 4 : 8), cores = navigator.hardwareConcurrency || 4;
            let gpu = '';
            try { const c = document.createElement('canvas'), gl = c.getContext('webgl2') || c.getContext('webgl'); if (gl) { const ext = gl.getExtension('WEBGL_debug_renderer_info'); gpu = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER) || ''); const lose = gl.getExtension('WEBGL_lose_context'); lose && lose.loseContext(); } } catch (e) {}
            const weakGPU = /Mali-(4|T[678]|G3[1-9]|G5[12]|G6[0-9]\b)|Adreno \(TM\) ?[2-5]\d\d|PowerVR|SwiftShader|llvmpipe|Intel\(R\) (HD|UHD) Graphics [2-6]\d\d\b/i.test(gpu);
            let tier = IS_MOBILE ? ((mem <= 3 || cores <= 4 || weakGPU) ? 0 : (mem >= 6 && cores >= 8) ? 2 : 1) : ((mem <= 4 || cores <= 4 || weakGPU) ? 2 : 3);
            const sig = [navigator.userAgent, screen.width, screen.height, window.devicePixelRatio || 1].join('|');
            let stored = null; try { stored = JSON.parse(localStorage.getItem('sucity.q.v3') || 'null'); } catch (e) {}
            if (stored && stored.sig === sig && typeof stored.tier === 'number') tier = Math.min(tier, stored.tier);
            tier = Math.max(0, tier - SAFE_LEVEL);
            return { tier, boot: tier, mem, cores, gpu, weakGPU, sig };
        })();
        const LOW_MEM = SAFE_MODE || Q.tier === 0 || (navigator.deviceMemory && navigator.deviceMemory <= 3);
        // eser dokularının bellekteki en büyük kenarı. Yalnız kameraya en yakın eserler tam çözünürlüğe akıtılır (masaüstünde de);
        // incelenen binanın eseri orijinal çözünürlükte yüklenir. Renk ve kadraj asla değişmez, yalnız bellekteki boyut.
        const ART_MAX = SAFE_MODE ? 320 : IS_MOBILE ? [384, 640, 768][Math.min(2, Q.tier)] : (Q.tier >= 3 ? 1024 : 768);
        const ART_NEAR = SAFE_MODE ? 640 : IS_MOBILE ? [900, 1280, 1536][Math.min(2, Q.tier)] : (Q.tier >= 3 ? 2048 : 1536);
        const ART_NEAR_K = SAFE_MODE ? 3 : IS_MOBILE ? [6, 12, 16][Math.min(2, Q.tier)] : (Q.tier >= 3 ? 28 : 18);
        if (IS_MOBILE) { FEATURES.refraction = false; if (LOW_MEM) { FEATURES.shadows = false; FEATURES.fish = false; } }
        if (SAFE_MODE) { FEATURES.shadows = false; FEATURES.fish = false; FEATURES.seagulls = false; }
        const MAX_PR = SAFE_MODE ? 1 : IS_MOBILE ? [1.25, 1.5, 1.75][Math.min(2, Q.tier)] : 2;
        // v3 · SU'rreal renk derecelendirmesi: ACES + çok hafif ayrık tonlama (gölgede derin çivit-petrol, ışıkta sıcak inci).
        // Ton eşleme aşamasına gömülüdür → ek geçiş yok, telefonda bedava. Eserler toneMapped:false olduğu için ona hiç dokunmaz.
        THREE.ShaderChunk.tonemapping_pars_fragment = THREE.ShaderChunk.tonemapping_pars_fragment.replace('vec3 CustomToneMapping( vec3 color ) { return color; }', `
            vec3 CustomToneMapping( vec3 color ) {
                vec3 c = ACESFilmicToneMapping( color );
                float l = dot( c, vec3( 0.2126, 0.7152, 0.0722 ) );
                vec3 shadowTint = vec3( 0.93, 0.99, 1.07 ), lightTint = vec3( 1.035, 1.0, 0.955 );
                c *= mix( shadowTint, lightTint, smoothstep( 0.08, 0.72, l ) );
                c = mix( vec3( l ), c, 1.04 );
                return clamp( c + vec3( 0.004, 0.006, 0.009 ) * ( 1.0 - l ), 0.0, 1.0 );
            }`);

        // ===================== ORİJİNAL KONTROL DEĞİŞKENLERİ =====================
        let scene, camera, renderer, car, keys = {}, carSpeed = 0, maxSpeed = 0.8, acceleration = 0.02;
        let deceleration = 0.01, turnSpeed = 0, maxTurnSpeed = 0.03, isMouseDown = false;
        let mouseX = 0, mouseY = 0, cameraRadius = 150, cameraTheta = 0, cameraPhi = Math.PI / 6;
        let cameraMode = 0, cameraYaw = 0, cameraPitch = -0.1, cameraDistance = 20;
        let targetCameraPosition = new THREE.Vector3(), targetLookAt = new THREE.Vector3();
        let sphereBuildings = [], birdMixers = [];
        let seed = 12345;
        let allBuildings = [];
        let selectedBuilding = null;
        let outlineMesh = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        function seededRandom() { const x = Math.sin(seed++) * 10000; return x - Math.floor(x); }
        function random(min, max) { return seededRandom() * (max - min) + min; }
        function distance(pos1, pos2) {
            if (!pos1 || !pos2) return Infinity;
            return Math.sqrt(Math.pow(pos1.x - pos2.x, 2) + Math.pow(pos1.z - pos2.z, 2));
        }

        // ===================== DÜNYA SABİTLERİ =====================
        const CITY_RADIUS = 640, ROAD_WIDTH = 14, ROAD_HALF = 7, DECK = 2.4, SEABED = -16, WATER_Y = 0;
        const BASE_Y = WATER_Y - 0.85;   // binaların tabanı: orijinaldeki gibi ~0.85 birim suyun içinde
        const SKYBOX_RADIUS = 1400, ROAM_RADIUS = 1150, PLINTH = 1.6, GAP = 3, SETBACK = 4;
        const PLAZA_R = 30;
        const DISTRICTS = [
            { key: 'core', name: 'Merkez Meydan', r: 62 },
            { key: 'pearl', name: 'İnci Adacıkları', r: 162 },
            { key: 'ink', name: 'Mürekkep Adacıkları', r: 270 },
            { key: 'chrome', name: 'Krom Adacıkları', r: 383 },
            { key: 'current', name: 'Akıntı Adacıkları', r: 498 },
            { key: 'crown', name: 'Taç Adacıkları', r: 680 },
            { key: 'sea', name: 'Açık Deniz', r: 1e9 }
        ];
        function districtOf(x, z) { const r = Math.hypot(x, z); for (const d of DISTRICTS) if (r < d.r) return d; return DISTRICTS[DISTRICTS.length - 1]; }
        const U = { time: { value: 0 }, night: { value: 0 } };
        const TOD = { hour: 10.4, target: null, cycle: false, speed: 0.2, applied: -99, envAt: -99, night: 0, el: 0 };
        const SUN = new THREE.Vector3(), MOON = new THREE.Vector3(), LIGHT = new THREE.Vector3(), SUN_COL = new THREE.Color();

        let roadPaths = [], roadPts = [], placed = [], perches = [], lampSpots = [], pathNodes = [], gardenRings = [], fountainPts = null;
        let aviationPts = [], bridgeSpots = [];
        // Seçili bina görüntülenirken kamera ile bina arasına giren her şey (diğer binalar, çatıları, köprüleri) kesilir: önüne hiçbir şey geçemez.
        const CUT = { on: { value: 0 }, a: { value: new THREE.Vector3() }, b: { value: new THREE.Vector3() }, r: { value: 0 } };
        const BUILDINGS = [];   // her bina: { id, mesh, type, dims, district, roof, glaze, f } — NFT kaydı
        let MAT = {}, buildingMats = [], maxAniso = 4;
        let sunLight, hemiLight, selectSpot, skyMesh, ocean, seabed, envSky = null, envScene = null, envRT = null, pmrem = null;
        let cylRoofs = [], updaters = [], nightHooks = [], hiddenInMirror = [], underwaterOnly = [];
        const mirror = {}, refr = { on: false, scale: 0.6 };
        const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler();
        const tmpS = new THREE.Vector3(), tmpM = new THREE.Matrix4(), tmpM2 = new THREE.Matrix4(), dummy = new THREE.Object3D();
        const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

        // ===================== SHADER'LAR =====================
        // v6 · deniz yüzeyinin yüksekliği: okyanus gölgelendiricisiyle birebir aynı dalgalar ve aynı yerel sönümleme (waveK).
        // Su üstünde duran düz yüzeyler (köpük halkaları, mum ışık havuzları) bununla dalganın üstüne oturur → dalga içinden geçip
        // titreşmez, yırtılmaz.
        const SEA_WAVE = { value: 1.0 };
        const SEA_SEG = IS_MOBILE ? 128 : 192;
        const GLSL_SEA = `
            float seaWK(float L, float sp){ return smoothstep(3.0 * sp, 5.5 * sp, L); }
            float seaG(vec2 dir, float L, float A, vec2 p, float t){ vec2 d = normalize(dir); float k = 6.2831853 / L; float c = sqrt(9.8 / k); return A * sin(k * (dot(d, p) - c * t)); }
            float seaH(vec2 p, float t, float wv){
                float dl = length(p - cameraPosition.xz);
                float sp = max(1.1 + 0.034 * dl, 6.2832 * dl / ${SEA_SEG.toFixed(1)});
                float amp = wv * mix(0.22, 1.0, smoothstep(610.0, 1150.0, length(p))) * (1.0 - smoothstep(1600.0, 5200.0, dl));
                return seaG(vec2(1.0, 0.25), 96.0, 0.80 * amp * seaWK(96.0, sp), p, t) + seaG(vec2(0.8, -0.6), 57.0, 0.46 * amp * seaWK(57.0, sp), p, t)
                     + seaG(vec2(-0.3, 1.0), 33.0, 0.25 * amp * seaWK(33.0, sp), p, t) + seaG(vec2(0.95, 0.5), 19.0, 0.13 * amp * seaWK(19.0, sp), p, t)
                     + seaG(vec2(-0.7, -0.4), 11.0, 0.065 * amp * seaWK(11.0, sp), p, t) + seaG(vec2(0.2, -1.0), 6.3, 0.03 * amp * seaWK(6.3, sp), p, t);
            }`;
        const GLSL_NOISE = `
            float qh(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }
            float qn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
                return mix(mix(qh(i), qh(i+vec2(1.0,0.0)), f.x), mix(qh(i+vec2(0.0,1.0)), qh(i+vec2(1.0,1.0)), f.x), f.y); }
            float qfbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a*qn(p); p = p*2.03 + vec2(1.7, 9.2); a *= 0.5; } return s/0.96875; }
        `;
        // Tek saçılımlı atmosfer (Rayleigh + Mie), birimler km. Gün batımı ve mavi saat renkleri buradan doğal olarak çıkar.
        const GLSL_ATMO = `
            const float Re = 6360.0; const float Ra = 6420.0;
            const vec3 bR = vec3(5.8e-3, 13.5e-3, 33.1e-3); const float bM = 21e-3;
            const float Hr = 7.994; const float Hm = 1.2; const float gM = 0.76;
            // v3 · ozon (Chappuis bandı) soğurması: Rayleigh yoğunluğuna orantılı yaklaşım. Mavi saati gri değil derin çivit yapar,
            // gün batımında ufku daha doygun turuncu-gül, tepeyi daha mavi tutar.
            const vec3 bO = vec3(2.04e-3, 4.97e-3, 0.21e-3);
            vec2 raySph(vec3 ro, vec3 rd, float r){ float b = dot(ro, rd); float c = dot(ro, ro) - r*r; float d = b*b - c; if (d < 0.0) return vec2(1e9, -1e9); d = sqrt(d); return vec2(-b - d, -b + d); }
            vec3 atmosphere(vec3 rd, vec3 sd, float I){
                vec3 ro = vec3(0.0, Re + 0.002, 0.0);
                float tmax = raySph(ro, rd, Ra).y;
                float ds = tmax / float(ISTEPS);
                float mu = dot(rd, sd);
                float pR = 3.0 / (50.2654825) * (1.0 + mu*mu);
                float pM = 3.0 / (25.1327412) * ((1.0 - gM*gM) * (1.0 + mu*mu)) / ((2.0 + gM*gM) * pow(1.0 + gM*gM - 2.0*gM*mu, 1.5));
                vec3 sR = vec3(0.0), sM = vec3(0.0); float odR = 0.0, odM = 0.0;
                for (int i = 0; i < ISTEPS; i++) {
                    vec3 p = ro + rd * (float(i) + 0.5) * ds;
                    float h = length(p) - Re;
                    float hr = exp(-h / Hr) * ds, hm = exp(-h / Hm) * ds;
                    odR += hr; odM += hm;
                    float dl = raySph(p, sd, Ra).y / float(JSTEPS);
                    float lR = 0.0, lM = 0.0; bool lit = true;
                    for (int j = 0; j < JSTEPS; j++) {
                        vec3 q = p + sd * (float(j) + 0.5) * dl;
                        float hh = length(q) - Re;
                        if (hh < 0.0) { lit = false; break; }
                        lR += exp(-hh / Hr) * dl; lM += exp(-hh / Hm) * dl;
                    }
                    if (lit) { vec3 att = exp(-((bR + bO) * (odR + lR) + bM * 1.1 * (odM + lM))); sR += att * hr; sM += att * hm; }
                }
                return I * (sR * bR * pR + sM * bM * pM);
            }
        `;
        const SKY_VS = `
            varying vec3 vDir;
            void main(){
                vDir = normalize(position);
                vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                gl_Position = p.xyww;
                gl_Position.z = p.w * 0.99999;
            }`;
        const SKY_FS = `
            uniform vec3 uSunDir; uniform vec3 uMoonDir; uniform float uNight; uniform float uTime; uniform float uClouds;
            uniform vec3 uSunCol; uniform float uSunI; uniform vec3 uZenith;
            varying vec3 vDir;
            ${GLSL_NOISE}
            ${GLSL_ATMO}
            vec3 twilight(vec3 rd, vec3 sd){
                float k = smoothstep(-0.21, -0.02, sd.y) * (1.0 - smoothstep(-0.02, 0.06, sd.y));
                float azg = max(dot(normalize(rd.xz + 1e-5), normalize(sd.xz + 1e-5)), 0.0);
                float hz = pow(1.0 - max(rd.y, 0.0), 3.0);
                return (vec3(0.010, 0.022, 0.060) * (0.55 + 0.45 * hz) + vec3(0.07, 0.03, 0.012) * pow(azg, 4.0) * pow(1.0 - max(rd.y, 0.0), 10.0)) * k;
            }
            float sh3(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
            void main(){
                vec3 d = normalize(vDir);
                vec3 rd = normalize(vec3(d.x, max(d.y, 0.03), d.z));
                vec3 col = atmosphere(rd, uSunDir, uSunI);
                // gündüz ufuk: tek saçılım modelinin ufukta ürettiği sarı-yeşil bandı, gerçek gökyüzündeki gibi açık maviye çek
                float dayK = smoothstep(0.02, 0.22, uSunDir.y);
                float hb = pow(1.0 - rd.y, 7.0) * dayK;
                float lum0 = dot(col, vec3(0.2126, 0.7152, 0.0722));
                col = mix(col, lum0 * vec3(0.78, 0.92, 1.18), hb * 0.92);
                col += twilight(rd, uSunDir);
                float mu = dot(d, uSunDir);
                col += uSunCol * smoothstep(0.99957, 0.99977, mu) * 45.0 * smoothstep(-0.03, 0.01, uSunDir.y);
                // gece gökyüzü: ay ışığıyla zayıf mavi saçılım
                float hz = pow(1.0 - rd.y, 3.0);
                col += vec3(0.0035, 0.006, 0.014) * (0.45 + 0.55 * hz) * uNight;
                float mm = max(dot(d, uMoonDir), 0.0);
                col += vec3(0.30, 0.38, 0.56) * pow(mm, 30.0) * 0.06 * uNight;
                float disc = smoothstep(0.99935, 0.99958, mm);
                vec3 md = d - uMoonDir * mm;
                col += vec3(0.85, 0.87, 0.92) * disc * (1.3 + 0.35 * qn(md.xz * 900.0)) * smoothstep(-0.05, 0.05, uMoonDir.y) * (0.25 + 0.75 * uNight);
                if (d.y > 0.0) {
                    vec3 sp = d * 380.0; vec3 cell = floor(sp); float r = sh3(cell);
                    if (r > 0.9955) {
                        vec3 f = fract(sp) - 0.5;
                        float s = smoothstep(0.32, 0.0, length(f));
                        float tw = 0.65 + 0.35 * sin(uTime * (1.5 + r * 3.0) + r * 500.0);
                        col += mix(vec3(1.0, 0.86, 0.72), vec3(0.75, 0.85, 1.0), fract(r * 91.0)) * s * tw * uNight * smoothstep(0.02, 0.25, d.y) * 0.9;
                    }
                }
                if (uClouds > 0.5 && d.y > 0.0) {
                    // bulutlar gökyüzü boyunca yavaşça döner ve sürekli biçim değiştirir (zamanla değişen alan bükmesi)
                    float ang = uTime * 0.013; mat2 rot = mat2(cos(ang), -sin(ang), sin(ang), cos(ang));
                    vec2 cp = rot * (d.xz / (d.y + 0.10)) * 1.4 + uTime * vec2(0.006, 0.003);
                    vec2 wv = vec2(qfbm(cp * 0.55 + uTime * 0.028), qfbm(cp * 0.55 + vec2(7.3, 2.1) - uTime * 0.024));
                    vec2 wv2 = vec2(qfbm(cp * 1.3 - uTime * 0.04 + 3.1), qfbm(cp * 1.3 + uTime * 0.035 + 8.4));
                    vec2 cq = cp * 1.2 + (wv - 0.5) * 1.6 + (wv2 - 0.5) * 0.55;
                    float n = qfbm(cq);
                    float n2 = qfbm(cq + rot * uSunDir.xz * 0.07);
                    float cov = smoothstep(0.52, 0.8, n) * smoothstep(0.0, 0.2, d.y);
                    float thick = smoothstep(0.52, 0.95, n);
                    float lk = clamp(1.0 - (n2 - n) * 6.0, 0.3, 1.35);
                    float silver = pow(max(mu, 0.0), 10.0) * (1.0 - thick) * 1.8;
                    vec3 amb = uZenith * (0.95 - 0.35 * thick);
                    vec3 lit = uSunCol * uSunI * 0.055 * (lk + silver) * smoothstep(-0.06, 0.05, uSunDir.y);
                    vec3 cCol = amb + lit + vec3(0.012, 0.016, 0.026) * uNight + vec3(0.05, 0.055, 0.07) * pow(mm, 8.0) * uNight;
                    // yüksek, ince sirrüs katmanı
                    vec2 hp = rot * (d.xz / (d.y + 0.25)) * vec2(0.6, 2.2) + uTime * vec2(0.006, 0.0);
                    float ci = smoothstep(0.62, 0.9, qfbm(hp * 1.6 + wv * 0.4)) * smoothstep(0.05, 0.4, d.y) * 0.35;
                    col = mix(col, uZenith * 1.2 + uSunCol * uSunI * 0.04 * smoothstep(-0.06, 0.05, uSunDir.y), ci * (1.0 - cov));
                    col = mix(col, cCol, cov * 0.9);
                }
                // ufkun altı: gökyüzü değil, denizden yansıyan koyu ortam (yansımalar ve ortam ışığı sararmasın)

        const OCEAN_VS = `
            uniform mat4 uTexMat; uniform float uTime; uniform float uWave;
            varying vec4 vMirror; varying vec3 vWP; varying vec3 vGN; varying float vCrest; varying vec2 vDsp;
            void gerstner(vec2 dir, float L, float A, float Q, vec2 p, inout vec3 dsp, inout vec3 nrm, inout float crest){
                vec2 d = normalize(dir); float k = 6.2831853 / L; float c = sqrt(9.8 / k);
                float f = k * (dot(d, p) - c * uTime);
                float cf = cos(f), sf = sin(f);

                nrm.x -= d.x * k * A * cf; nrm.z -= d.y * k * A * cf; nrm.y -= Q * k * A * sf;

                gerstner(vec2(-0.3, 1.0), 33.0, 0.25 * amp * waveK(33.0, sp), 0.65, p, dsp, n, crest);
                gerstner(vec2(0.95, 0.5), 19.0, 0.13 * amp * waveK(19.0, sp), 0.70, p, dsp, n, crest);
                gerstner(vec2(-0.7, -0.4), 11.0, 0.065 * amp * waveK(11.0, sp), 0.70, p, dsp, n, crest);
                gerstner(vec2(0.2, -1.0), 6.3, 0.03 * amp * waveK(6.3, sp), 0.70, p, dsp, n, crest);

        const OCEAN_FS = `
            uniform sampler2D uMirror; uniform sampler2D uNormal; uniform sampler2D uRefrTex; uniform sampler2D uDepth;
            uniform float uTime; uniform float uNight; uniform float uRefr; uniform float uNear; uniform float uFar;
            uniform vec2 uRes;
            uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uSunVis;
            uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uScatter; uniform vec3 uFoamCol;

            float viewZ(float d){ return uNear * uFar / ((uFar - uNear) * d - uFar); }
            vec3 tm(vec3 c){

                    return toneMapping(c);
                #else
                    return c;
                #endif
            }
            void main(){
                vec2 p = vWP.xz; float t = uTime;

                vec3 b = texture2D(uNormal, p * 0.029 + vec2(-t * 0.016, t * 0.009)).xyz * 2.0 - 1.0;

                vec3 toEye = cameraPosition - vWP; float dist = length(toEye); vec3 V = toEye / dist;

                    // yakında dördüncü, çok ince kırışıklık katmanı (yalnız güçlü cihazlarda)

                    float glit = step(0.985, qh(gc + floor(t * 3.0))) * pow(nh, 180.0) * (1.0 - smoothstep(60.0, 900.0, dist));

                float sss = (pow(max(dot(V, Lb), 0.0), 4.0) * 1.3 + 0.18 * pow(max(dot(V, -L), 0.0), 2.0)) * clamp(vCrest * 9.0 + 0.15, 0.0, 1.0) * mix(0.55, 1.25, thin) * uSunVis;
                float patchN = qn(p * 0.0042 + 3.1) * 0.65 + qn(p * 0.013 - 1.7) * 0.35;

                float foam = smoothstep(0.11, 0.17, vCrest) * smoothstep(0.62, 0.88, foamN * 0.6 + streak * 0.4) * 0.45 * openSea * (1.0 - smoothstep(120.0, 700.0, dist));

                    vec2 duv = suv + N.xz * 0.05 * clamp(thick0 * 0.2, 0.0, 1.0) / (1.0 + dist * 0.004);
                    float thick = -viewZ(texture2D(uDepth, duv).r) - wz;

                    float inscat = 1.0 - exp(-thick * 0.13);
                    vec3 body = under * T + tm(bodyLit) * inscat;
                    float shore = (1.0 - smoothstep(0.0, 1.1, thick)) * (0.35 + 0.35 * smoothstep(0.4, 0.75, foamN + 0.25 * sin(t * 1.7 + thick * 5.0))) * (1.0 - smoothstep(200.0, 900.0, dist));
                    foam = max(foam, shore);
                    col = mix(body, refl, F);
                } else {
                    col = mix(tm(bodyLit), refl, F * 0.92);

                col = mix(col, uFoamCol, clamp(foam, 0.0, 1.0) * 0.85);
                col += tm(spec);

                col = mix(col, tm(uFogColor), fogF);
                alpha = mix(alpha, 1.0, fogF);
                gl_FragColor = linearToOutputTexel(vec4(col, alpha));
            }`;

        const SEABED_VS = `
            varying vec3 vWP;
            void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vWP = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`;
        const SEABED_FS = `
            uniform float uTime; uniform float uNight; uniform vec3 uDeep; uniform float uAbs;
            varying vec3 vWP;
            ${GLSL_NOISE}
            float caustic(vec2 uv, float time){
                vec2 p = mod(uv * 6.28318530718, 6.28318530718) - 250.0;
                vec2 i = vec2(p); float c = 1.0; float inten = 0.005;

                return pow(abs(c), 8.0);

            void main(){

                float n = qn(p * 0.08) * 0.6 + qn(p * 0.5) * 0.4;

                #include <encodings_fragment>

        const GLOW_VS = `
            attribute float aSize; attribute float aPhase;
            uniform float uScale; uniform float uTime; uniform float uBlink;
            varying float vFlick;
            void main(){
                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = clamp(aSize * uScale / -mv.z, 1.0, 256.0);

        const FOUNTAIN_VS = `

        //  · cila (clearcoat): F0 = 0 Schlick → yalnız yüzeyin sıyırma açılarında canlı küp haritayı yansıtır, yüz değişmez

        const ART_VS_HEAD = 'attribute float aBid;\nvarying float vBid; varying vec3 vArtN;\n';

        const ART_FS_BODY = `

        // ===================== PROSEDÜREL DOKULAR =====================
        let texSeed = 1;
        function hash2(i, j) {
            let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(texSeed, 982451653)) | 0;
            h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;

            const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
            let x0 = xi % px; if (x0 < 0) x0 += px; let x1 = x0 + 1; if (x1 >= px) x1 -= px;
            let y0 = yi % py; if (y0 < 0) y0 += py; let y1 = y0 + 1; if (y1 >= py) y1 -= py;
            const r0 = (y0 & 255) << 8, r1 = (y1 & 255) << 8;
            const a = NT[r0 | (x0 & 255)], b = NT[r0 | (x1 & 255)], c = NT[r1 | (x0 & 255)], d = NT[r1 | (x1 & 255)];
            return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
        }
        function fbm(u, v, bu, bv, oct) {
            let s = 0, amp = 0.5, fu = bu, fv = bv, norm = 0;
            for (let o = 0; o < oct; o++) { s += amp * vnoise(u * fu, v * fv, fu, fv); norm += amp; fu *= 2; fv *= 2; amp *= 0.5; }
            return s / norm;
        }
        function cell(u, v, C, R, stagger) {
            const cy = v * R, row = Math.floor(cy), fy = cy - row;
            const cx = u * C + (stagger ? (row % 2) * 0.5 : 0), ci = Math.floor(cx), fx = cx - ci;
            return { row: ((row % R) + R) % R, col: ((ci % C) + C) % C, fx, fy };
        }

        const texCache = {};
        function makeTexture(name, N, fn, normalStrength) {
            const ck = name + N + '_' + normalStrength;
            if (texCache[ck]) return texCache[ck];
            texSeed = 7; for (const ch of name) texSeed = (texSeed * 31 + ch.charCodeAt(0)) | 0;
            seedNoise();
            const cc = document.createElement('canvas'); cc.width = cc.height = N;
            const ctx = cc.getContext('2d'), img = ctx.createImageData(N, N), H = new Float32Array(N * N);
            const o = { r: 0, g: 0, b: 0, h: 0 };
            const c255 = x => Math.max(0, Math.min(255, x * 255));
            for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
                o.h = 0; fn((x + 0.5) / N, 1 - (y + 0.5) / N, o);
                const i = y * N + x; H[i] = o.h;
                img.data[i * 4] = c255(o.r); img.data[i * 4 + 1] = c255(o.g); img.data[i * 4 + 2] = c255(o.b); img.data[i * 4 + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
            const map = new THREE.CanvasTexture(cc);
            map.encoding = THREE.sRGBEncoding; map.wrapS = map.wrapT = THREE.RepeatWrapping; map.anisotropy = maxAniso;
            let normalMap = null;
            if (normalStrength) {
                const nc = document.createElement('canvas'); nc.width = nc.height = N;
                const nctx = nc.getContext('2d'), nimg = nctx.createImageData(N, N);
                for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
                    const hl = H[y * N + (x - 1 + N) % N], hr = H[y * N + (x + 1) % N];
                    const hu = H[((y - 1 + N) % N) * N + x], hd = H[((y + 1) % N) * N + x];
                    const dx = (hr - hl) * normalStrength, dy = (hu - hd) * normalStrength, len = Math.sqrt(dx * dx + dy * dy + 1), i = (y * N + x) * 4;
                    nimg.data[i] = (-dx / len * 0.5 + 0.5) * 255; nimg.data[i + 1] = (-dy / len * 0.5 + 0.5) * 255;
                    nimg.data[i + 2] = (1 / len * 0.5 + 0.5) * 255; nimg.data[i + 3] = 255;
                }
                nctx.putImageData(nimg, 0, 0);
                normalMap = new THREE.CanvasTexture(nc);
                normalMap.wrapS = normalMap.wrapT = THREE.RepeatWrapping; normalMap.anisotropy = maxAniso;
            }
            return (texCache[ck] = { map, normalMap });
        }

        const TEX = {
            tile(u, v, o) {
                const c = cell(u, v, 5, 8, true), r1 = hash2(c.col + 11, c.row + 5), r2 = hash2(c.col + 3, c.row + 29);
                const barrel = Math.pow(Math.sin(Math.PI * c.fx), 0.6);
                const under = 1 - 0.5 * sstep(0.70, 1.0, c.fy), lip = 0.82 + 0.18 * sstep(0, 0.07, c.fy);
                const w = 0.82 + 0.3 * fbm(u, v, 4, 4, 4), dark = r2 < 0.13 ? 0.78 : 1;
                const sh = (0.48 + 0.52 * barrel) * under * lip * w * dark;
                o.r = (0.64 + 0.14 * (r1 - 0.5)) * sh; o.g = (0.31 + 0.08 * (r1 - 0.5)) * sh; o.b = (0.20 + 0.05 * (r1 - 0.5)) * sh;
                const li = sstep(0.62, 0.76, fbm(u, v, 8, 8, 3)) * 0.35;
                o.r = o.r * (1 - li) + 0.40 * li; o.g = o.g * (1 - li) + 0.41 * li; o.b = o.b * (1 - li) + 0.30 * li;
                o.h = barrel * 0.6 + (1 - c.fy) * 0.4;
            },
            slate(u, v, o) {
                const c = cell(u, v, 6, 12, true), r1 = hash2(c.col + 5, c.row + 9);
                const gap = (c.fx < 0.03 || c.fx > 0.97 || c.fy < 0.05) ? 1 : 0;
                const tone = (0.82 + 0.3 * r1) * (0.9 + 0.2 * fbm(u, v, 8, 8, 3));
                o.r = 0.22 * tone; o.g = 0.245 * tone; o.b = 0.285 * tone;
                if (hash2(c.col, c.row + 77) < 0.15) { o.r *= 1.12; o.g *= 1.04; }
                if (gap) { o.r *= 0.35; o.g *= 0.35; o.b *= 0.35; }
                o.h = gap ? 0 : 0.5 + 0.5 * (1 - c.fy) + 0.08 * fbm(u, v, 16, 16, 2);
            },
            zinc(u, v, o) {
                const s = Math.abs((u * 8) % 1 - 0.5) * 2, seam = sstep(0.88, 0.96, s);
                const streak = 0.88 + 0.16 * fbm(u, v, 64, 4, 3);
                o.r = 0.56 * streak * (1 + seam * 0.12); o.g = 0.59 * streak * (1 + seam * 0.12); o.b = 0.62 * streak * (1 + seam * 0.12);
                o.h = seam + 0.05 * (1 - s);
            },
            copper(u, v, o) {
                const n = fbm(u, v, 4, 4, 5), s = Math.abs((u * 6) % 1 - 0.5) * 2, seam = sstep(0.88, 0.96, s);
                const k = sstep(0.35, 0.7, n);
                o.r = 0.30 + 0.07 * k; o.g = 0.58 - 0.14 * k; o.b = 0.50 - 0.08 * k;
                const st = sstep(0.6, 0.78, fbm(u, v, 2, 16, 4)) * 0.45;
                o.r = o.r * (1 - st) + 0.33 * st; o.g = o.g * (1 - st) + 0.26 * st; o.b = o.b * (1 - st) + 0.19 * st;
                o.r *= 1 + seam * 0.15; o.g *= 1 + seam * 0.15; o.b *= 1 + seam * 0.15;
                o.h = seam + 0.1 * n;
            },
            wood(u, v, o) {
                const R = 10, row = Math.floor(v * R), fy = v * R - row, sh = hash2(row, 3);
                const px = u * 2 + sh, id = Math.floor(px), fx = px - id, r = hash2(id, row + 40);
                const gap = (fy < 0.07 || fx < 0.012) ? 1 : 0;
                const grain = 0.86 + 0.14 * Math.sin(Math.PI * 2 * (u * 40) + fbm(u, v, 4, 16, 3) * 6);
                const t = (0.72 + 0.4 * r) * grain;
                o.r = 0.52 * t; o.g = 0.37 * t; o.b = 0.25 * t;
                if (gap) { o.r *= 0.3; o.g *= 0.3; o.b *= 0.3; }
                o.h = gap ? 0 : 0.8 + 0.2 * grain;
            },
            gravel(u, v, o) {
                const n = fbm(u, v, 32, 32, 3), sp = hash2(Math.floor(u * 128), Math.floor(v * 128));
                const g = 0.36 + 0.24 * n + 0.14 * (sp - 0.5);
                o.r = g * 1.03; o.g = g; o.b = g * 0.95; o.h = n * 0.6 + sp * 0.4;
            },
            sedum(u, v, o) {
                const n1 = fbm(u, v, 8, 8, 4), n2 = fbm(u, v, 32, 32, 3), k = sstep(0.52, 0.7, n1), t = 0.72 + 0.5 * n2;
                o.r = (0.26 + 0.24 * k) * t; o.g = (0.40 - 0.04 * k) * t; o.b = (0.15 + 0.04 * k) * t;
                if (hash2(Math.floor(u * 96), Math.floor(v * 96)) > 0.985) { o.r = 0.9; o.g = 0.85; o.b = 0.4; }
                o.h = n2;
            },
            pavers(u, v, o) {
                const c = cell(u, v, 4, 8, true), r1 = hash2(c.col + 1, c.row + 2);
                const e = Math.min(Math.min(c.fx, 1 - c.fx) / 4, Math.min(c.fy, 1 - c.fy) / 8);
                const bevel = sstep(0.002, 0.012, e), t = (0.84 + 0.28 * r1) * (0.88 + 0.22 * fbm(u, v, 8, 8, 4));
                o.r = 0.60 * t; o.g = 0.57 * t; o.b = 0.52 * t;
                if (e < 0.0025) { o.r = 0.26; o.g = 0.25; o.b = 0.23; }
                o.h = bevel;
            },
            ashlar(u, v, o) {
                const c = cell(u, v, 3, 4, true), r1 = hash2(c.col + 6, c.row + 1);
                const e = Math.min(Math.min(c.fx, 1 - c.fx) / 3, Math.min(c.fy, 1 - c.fy) / 4);
                const t = (0.85 + 0.25 * r1) * (0.8 + 0.3 * fbm(u, v, 8, 8, 5));
                o.r = 0.66 * t; o.g = 0.62 * t; o.b = 0.56 * t;
                if (e < 0.004) { o.r *= 0.55; o.g *= 0.55; o.b *= 0.55; }
                o.h = sstep(0.003, 0.02, e) * 0.8 + 0.2 * fbm(u, v, 16, 16, 3);
            },
            brick(u, v, o) {
                const c = cell(u, v, 4, 12, true), r1 = hash2(c.col + 2, c.row + 8);
                const mortar = (c.fx < 0.05 || c.fy < 0.1) ? 1 : 0, t = 0.8 + 0.35 * r1;
                o.r = mortar ? 0.68 : 0.56 * t; o.g = mortar ? 0.66 : 0.28 * t; o.b = mortar ? 0.60 : 0.20 * t;
                o.h = mortar ? 0 : 1;
            },
            grass(u, v, o) {
                const n = fbm(u, v, 16, 16, 5), n2 = fbm(u, v, 64, 64, 2), t = 0.78 + 0.45 * n2;
                o.r = (0.19 + 0.10 * n) * t; o.g = (0.35 + 0.14 * n) * t; o.b = (0.11 + 0.05 * n) * t; o.h = n2;

            plaster(u, v, o) {

            solar(u, v, o) {

                const bus = Math.abs(fx - 0.5) < 0.012 ? 1 : 0, t = 0.9 + 0.2 * fbm(u, v, 8, 8, 2);
                if (line) { o.r = 0.55; o.g = 0.58; o.b = 0.62; } else if (bus) { o.r = 0.32; o.g = 0.36; o.b = 0.42; }
                else { o.r = 0.05 * t; o.g = 0.09 * t; o.b = 0.21 * t; }
                o.h = line ? 1 : 0;
            }
        };

        function patchMaterial(mat, key, opt) {
            const w = opt.weather || 0;
            mat.onBeforeCompile = sh => {
                sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vRP;')
                    .replace('#include <begin_vertex>', `#include <begin_vertex>
                        vec4 rpW = vec4(transformed, 1.0);
                        #ifdef USE_INSTANCING
                            rpW = instanceMatrix * rpW;
                        #endif
                        vRP = (modelMatrix * rpW).xyz;`);
                let frag = '#include <map_fragment>\n';
                if (w) frag += `float wN = qn(vRP.xz * 0.045) * 0.6 + qn(vRP.xz * 0.21 + vRP.y * 0.1) * 0.4;
                                diffuseColor.rgb *= ${(1 - w).toFixed(3)} + ${(2 * w).toFixed(3)} * wN;\n`;
                if (opt.wet) frag += `float wl = smoothstep(1.3, 0.1, vRP.y);
                                diffuseColor.rgb *= 1.0 - 0.45 * wl;
                                diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(0.5, 0.72, 0.58), smoothstep(0.2, -1.8, vRP.y) * 0.85);\n`;
                sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vRP;\n' + GLSL_NOISE)
                    .replace('#include <map_fragment>', frag);
                if (opt.wet) sh.fragmentShader = sh.fragmentShader.replace('#include <roughnessmap_fragment>',
                    '#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 0.22, smoothstep(1.3, 0.1, vRP.y));');
            };
            mat.customProgramCacheKey = () => 'pm-' + key;
            return mat;
        }

        function pbr(name, N, ns, opt) {
            const t = makeTexture(name, N, TEX[name], ns);
            const m = new THREE.MeshStandardMaterial({
                map: t.map, normalMap: t.normalMap, normalScale: new THREE.Vector2(opt.ns || 1, opt.ns || 1),
                roughness: opt.roughness, metalness: opt.metalness || 0, color: opt.color || 0xffffff,
                envMapIntensity: opt.env || 1, side: opt.side || THREE.FrontSide
            });
            if (opt.offset) { m.polygonOffset = true; m.polygonOffsetFactor = -opt.offset; m.polygonOffsetUnits = -opt.offset * 2; }
            if (opt.weather || opt.wet) patchMaterial(m, name + (opt.key || ''), opt);
            m.userData.uv = opt.uv || 6;
            return m;
        }

        // İnce film yanardönerliği: yansımayı bakış açısına göre spektrumda kaydırır (sabun köpüğü / petrol rengi)
        function iridescent(mat, strength, key) {
            mat.onBeforeCompile = sh => {
                sh.uniforms.uIrid = { value: strength };
                sh.fragmentShader = 'uniform float uIrid;\n' + sh.fragmentShader.replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
                    float iNdV = clamp(dot(normal, normalize(vViewPosition)), 0.0, 1.0);
                    vec3 film = 0.5 + 0.5 * cos(6.2831853 * (vec3(0.0, 0.33, 0.67) + (1.0 - iNdV) * 1.35 + 0.12));
                    vec3 iTint = mix(vec3(1.0), film * 1.45, uIrid);
                    reflectedLight.indirectSpecular *= iTint;
                    reflectedLight.directSpecular *= iTint;`);
            };
            mat.customProgramCacheKey = () => 'irid-' + key;
            return mat;
        }
        // Akan pigment yolu: mermerleme (domain-warp fbm) ile yolun boyunca yavaşça akan mürekkep damarları
        function pathMaterial() {
            const m = new THREE.MeshPhysicalMaterial({ color: 0xefe9df, roughness: 0.26, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.07, envMapIntensity: 1.0 });
            m.onBeforeCompile = sh => {
                sh.uniforms.uTime = U.time; sh.uniforms.uNight = U.night;
                sh.vertexShader = 'attribute vec2 aPath;\nvarying vec2 vPUv;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvPUv = aPath;');
                sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
                    uniform float uTime; uniform float uNight; varying vec2 vPUv;
                    ${GLSL_NOISE}
                    vec3 inkPalette(float t){ t = fract(t);
                        vec3 a = vec3(0.07, 0.14, 0.36), b = vec3(0.05, 0.32, 0.34), c = vec3(0.66, 0.47, 0.20), d = vec3(0.52, 0.25, 0.30);
                        if (t < 0.25) return mix(a, b, t * 4.0); if (t < 0.5) return mix(b, c, (t - 0.25) * 4.0);
                        if (t < 0.75) return mix(c, d, (t - 0.5) * 4.0); return mix(d, a, (t - 0.75) * 4.0); }`)
                    .replace('#include <map_fragment>', `#include <map_fragment>
                        float acr = abs(vPUv.y - 0.5) * 2.0;
                        vec2 q = vec2(vPUv.x * 0.42 - uTime * 0.018, vPUv.y * 1.6);
                        vec2 w = vec2(qfbm(q * 1.2 + vec2(0.0, uTime * 0.03)), qfbm(q * 1.2 + vec2(5.2, 1.3 - uTime * 0.02)));
                        float fm = qfbm(q * 1.7 + w * 2.6);
                        float marble = 0.5 + 0.5 * sin(fm * 14.0 + w.x * 6.0);
                        float pigMask = smoothstep(0.58, 0.96, marble) * (1.0 - smoothstep(0.5, 0.92, acr));
                        vec3 pig = inkPalette(fm * 1.3 + w.y * 0.5 + floor(vPUv.x / 97.0) * 0.17);
                        diffuseColor.rgb = mix(diffuseColor.rgb, pig, pigMask * 0.6);`)
                    .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 0.1, pigMask);')
                    .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += pig * pigMask * 0.06 * uNight;');
            };
            m.customProgramCacheKey = () => 'path';
            return m;
        }
        // Binanın tabanında yumuşak temas gölgesi (eserin rengine dokunmaz, yalnız alt metreleri karartır)
        function aoPatch(mat) {
            mat.onBeforeCompile = sh => {
                sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vWY;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvWY = (modelMatrix * vec4(transformed, 1.0)).y;');
                sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vWY;')
                    .replace('#include <map_fragment>', `#include <map_fragment>\ndiffuseColor.rgb *= mix(0.62, 1.0, smoothstep(${DECK.toFixed(2)}, ${(DECK + 4.5).toFixed(2)}, vWY));`);
            };
            mat.customProgramCacheKey = () => 'bao';
            return mat;
        }

        function createMaterials() {
            MAT.wood = pbr('wood', 256, 3, { roughness: 0.78, uv: 6, weather: 0.1 });
            MAT.gravel = pbr('gravel', 256, 4, { roughness: 0.95, uv: 6 });
            MAT.sedum = pbr('sedum', 256, 3, { roughness: 0.92, uv: 8, weather: 0.2 });
            MAT.grass = pbr('grass', 256, 3, { roughness: 0.95, uv: 10 });
            const glaze = (name, o) => {
                MAT[name] = new THREE.MeshPhysicalMaterial(Object.assign({ metalness: 0, envMapIntensity: 0.95 }, o));
                MAT[name + 'DS'] = new THREE.MeshPhysicalMaterial(Object.assign({ metalness: 0, envMapIntensity: 0.95, side: THREE.DoubleSide }, o));
            };
            glaze('pearl', { color: 0xebe5da, roughness: 0.34, clearcoat: 0.55, clearcoatRoughness: 0.18 });
            glaze('sand', { color: 0xd6c3a2, roughness: 0.42, clearcoat: 0.4, clearcoatRoughness: 0.25 });
            glaze('teal', { color: 0x2b666a, roughness: 0.28, clearcoat: 0.9, clearcoatRoughness: 0.08, envMapIntensity: 1.1 });
            glaze('graphite', { color: 0x292c31, roughness: 0.32, metalness: 0.25, clearcoat: 0.7, clearcoatRoughness: 0.1 });
            MAT.chrome = new THREE.MeshStandardMaterial({ color: 0xe0e3e8, metalness: 1, roughness: 0.1, envMapIntensity: 1.25 });
            MAT.irid = iridescent(new THREE.MeshStandardMaterial({ color: 0xd8dce2, metalness: 1, roughness: 0.08, envMapIntensity: 1.3 }), 0.75, 'c');
            MAT.iridDS = iridescent(new THREE.MeshStandardMaterial({ color: 0xd8dce2, metalness: 1, roughness: 0.08, envMapIntensity: 1.3, side: THREE.DoubleSide }), 0.75, 'cds');
            MAT.champagne = new THREE.MeshStandardMaterial({ color: 0xc8ae86, metalness: 1, roughness: 0.24 });
            // Gerçek zamanlı yansıma: şehrin kendisi (eserlerin renkleri, gökyüzü, bulutlar) küp haritaya çizilir ve cam / ayna yüzeylere yansır.
            LIVE_ENV.init();
            const liveEnv = LIVE_ENV.front.texture;
            // Sıvı cam (Liquid Glass): sahnenin arkası ayrı bir geçişte çizilir; cam, yüzey normaline ve kenar (bezel) profiline göre
            // bu görüntüyü kırar, RGB kanallarını ayrıştırır (dispersiyon), buzlu bulanıklıkla karıştırır, Fresnel ile canlı yansımayı ekler
            // ve kenarlarda Apple tarzı iki yönlü parlama (glare) üretir.
            LG.init();
            MAT.glass = lgMaterial({ thick: 1.2, frost: 0.05, disp: 0.03, tint: 0xf2f7fa, tintA: 0.06, refl: 0.9 });
            const tints = { pearl: [0xf4f6f8, 0.05], sand: [0xffe9c7, 0.12], teal: [0xbff0ea, 0.14], graphite: [0xc3c9d6, 0.14] };
            Object.keys(tints).forEach(k => { MAT['lg_' + k] = lgMaterial({ thick: 1.5, frost: 0.03, disp: 0.035, tint: tints[k][0], tintA: tints[k][1], refl: 0.85, cut: true }); MAT['mir_' + k] = MAT['lg_' + k]; });
            MAT.bridgeGlass = lgMaterial({ thick: 1.1, frost: 0.12, disp: 0.03, tint: 0xeaf6f8, tintA: 0.08, refl: 0.8, cut: true });
            MAT.roadGlass = lgMaterial({ thick: 0.6, frost: 0.28, disp: 0.02, tint: 0xe2f3f6, tintA: 0.1, refl: 0.7 });
            MAT.sphereGlass = lgMaterial({ thick: 5.0, frost: 0.0, disp: 0.06, tint: 0xf4fbff, tintA: 0.04, refl: 1.0, glare: 1.6 });
            MAT.ringGlass = lgMaterial({ thick: 2.0, frost: 0.0, disp: 0.05, tint: 0xfff4e2, tintA: 0.08, refl: 1.0, glare: 1.8 });
            MAT.sphereMirror = new THREE.MeshStandardMaterial({ color: 0xf6f7fa, metalness: 1, roughness: 0.01, envMap: liveEnv, envMapIntensity: 1.25 });
            // adacık aynaları: şehrin pişirilmiş küp haritasını yansıtan kusursuz ayna yüzey (her açıdan kararlı, kuş bakışında da)
            MAT.pedestal = patchMaterial(new THREE.MeshPhysicalMaterial({ color: 0xe4ddcf, roughness: 0.5, clearcoat: 0.3, clearcoatRoughness: 0.3 }), 'ped', { wet: true, weather: 0.06 });
            MAT.path = pathMaterial();
            MAT.soil = new THREE.MeshStandardMaterial({ color: 0x3b2c22, roughness: 1 });
            MAT.window = new THREE.MeshStandardMaterial({ color: 0x1d2630, metalness: 0.5, roughness: 0.15, emissive: 0xffb866, emissiveIntensity: 0, envMapIntensity: 1.4 });
            MAT.lampGlass = new THREE.MeshStandardMaterial({ color: 0xf2e6cc, roughness: 0.3, emissive: 0xffd9a0, emissiveIntensity: 0 });
            MAT.fountainWater = new THREE.MeshStandardMaterial({ color: 0x1d6f7d, metalness: 0.3, roughness: 0.06, envMapIntensity: 1.6 });
            [MAT.chrome, MAT.irid, MAT.iridDS, MAT.champagne].forEach(m => { m.envMap = liveEnv; });
            Object.keys(MAT).forEach(k => { if (MAT[k].envMap === liveEnv) LIVE_ENV.mats.push(MAT[k]); });
            Object.keys(MAT).forEach(k => { if (MAT[k].userData.uv === undefined) MAT[k].userData.uv = 6; });
            nightHooks.push(n => {
                MAT.window.emissiveIntensity = 2.0 * n;
                MAT.lampGlass.emissiveIntensity = 2.4 * n;
            });
        }

                else if (a === 'panel') { $('#su-insp').classList.toggle('min'); perspective(insp.persp || 'front'); }

                else if (b.dataset.a === 'reset') confirmBox(`${discovered.size} binalık keşif ilerlemesi sıfırlansın mı? Koleksiyonun etkilenmez.`, 'Keşfi sıfırla', () => { discovered = new Set(); discHistory = []; saveDiscovery(); syncAwake(); refreshStatus(true); renderAside(); drawMap(); toast('Bütün ruhlar yeniden uykuya daldı.'); });
            });
            $('#su-cclear').onclick = () => confirmBox(`Koleksiyondaki ${collection.length} bina çıkarılsın mı? Bu işlem geri alınamaz.`, 'Koleksiyonu temizle', () => { collection = []; saveCollection(); refreshColl(); toast('Koleksiyon temizlendi.'); });
            $('#su-ccancel').onclick = closeConfirm; $('#su-scrim').onclick = closeConfirm;
            $('#su-cok').onclick = () => { const cb = confirmCb; closeConfirm(); cb && cb(); };
            // görüntüleyici
            const img = $('#su-vimg');
            viewerPZ = new PanZoom($('#su-viewer'), pz => {
                img.style.transform = `translate(${pz.x}px, ${pz.y}px) scale(${pz.s})`;
                $('#su-vzoom').textContent = Math.round(pz.s * 100) + '%';
                $('#su-viewer').classList.toggle('pixel', pz.s > 2.5);
            });
            viewerPZ.onDbl = ev => { if (Math.abs(viewerPZ.s - 1) < 0.05) viewerPZ.fit(24); else viewerPZ.zoomAt(ev.clientX, ev.clientY, 1 / viewerPZ.s); };
            $('#su-vclose').onclick = closeViewer;
            ['#su-vclose', '.su-vbar', '.su-vinfo'].forEach(sel => $(sel).addEventListener('pointerdown', ev => ev.stopPropagation()));
            $('#su-vzin').onclick = () => viewerPZ.setScale(viewerPZ.s * 1.5);
            $('#su-vzout').onclick = () => viewerPZ.setScale(viewerPZ.s / 1.5);
            $('#su-vfit').onclick = () => viewerPZ.fit(24);
            $('#su-v1').onclick = () => viewerPZ.setScale(1);
            // harita
            wireMapCam();
            // içe aktarma
            $('#su-file').onchange = ev => { importFiles(ev.target.files); ev.target.value = ''; };
            const dz = $('#su-drop');
            ['dragenter', 'dragover'].forEach(n => dz.addEventListener(n, ev => { ev.preventDefault(); dz.classList.add('over'); }));
            ['dragleave', 'drop'].forEach(n => dz.addEventListener(n, () => dz.classList.remove('over')));
            let dragDepth = 0;
            window.addEventListener('dragenter', ev => { if (ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) { dragDepth++; $('#su-dropall').style.display = 'flex'; } });
            window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#su-dropall').style.display = 'none'; });
            window.addEventListener('dragover', ev => ev.preventDefault());
            window.addEventListener('drop', ev => { ev.preventDefault(); dragDepth = 0; $('#su-dropall').style.display = 'none'; if (ev.dataTransfer && ev.dataTransfer.files.length) { $('#su-import').classList.add('open'); importFiles(ev.dataTransfer.files); } });
            $('#su-alist').addEventListener('input', ev => {
                const card = ev.target.closest('.su-asset'), a = card && assets.find(x => x.id === card.dataset.id); if (!a || !ev.target.dataset.k) return;
                const k = ev.target.dataset.k, v = parseFloat(ev.target.value); a.rec.settings[k] = v;
                ev.target.nextElementSibling.textContent = v.toFixed(ev.target.step < 1 ? 1 : 0);
                if (k === 'count') { clearTimeout(a._t); a._t = setTimeout(() => buildAsset(a), 150); }
                else applyTransform(a);
                saveAsset(a);
            });
            $('#su-alist').addEventListener('click', ev => {
                const card = ev.target.closest('.su-asset'), a = card && assets.find(x => x.id === card.dataset.id); if (!a) return;
                const b = ev.target.closest('button'); if (!b) return;
                if (b.dataset.mode) { a.rec.settings.mode = b.dataset.mode; buildAsset(a); renderAssets(); saveAsset(a, true); if (b.dataset.mode === 'spirit') toast(`${a.name} artık gezgin ruh.`); }
                else if (b.dataset.a === 'here') { a.rec.settings.x = +car.position.x.toFixed(1); a.rec.settings.z = +car.position.z.toFixed(1); applyTransform(a); renderAssets(); saveAsset(a, true); }
                else if (b.dataset.a === 'del') confirmBox(`${a.name} şehirden kaldırılsın mı?`, 'Kaldır', () => { clearAsset(a); a.revoke(); assets.splice(assets.indexOf(a), 1); dbTx('readwrite', st => st.delete(a.id)); renderAssets(); });
            });
            // joystick (dokunmatik)
            const joy = $('#su-joy'), knob = joy.querySelector('i');
            if (window.matchMedia && matchMedia('(pointer: coarse)').matches) joy.classList.add('show');
            let jid = null;
            const jset = (dx, dy) => {
                const r = 44, l = Math.hypot(dx, dy), k = l > r ? r / l : 1; dx *= k; dy *= k;
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                const ax = Math.abs(dx) < 6 ? 0 : (dx - Math.sign(dx) * 6) / (r - 6), ay = Math.abs(dy) < 6 ? 0 : (dy - Math.sign(dy) * 6) / (r - 6);
                MOVE.analog = (ax || ay) ? { x: Math.sign(ax) * Math.pow(Math.abs(ax), 1.7), y: -Math.sign(ay) * Math.pow(Math.abs(ay), 1.4) } : null;
            };
            joy.addEventListener('pointerdown', ev => { jid = ev.pointerId; try { joy.setPointerCapture(jid); } catch (e) {} const r = joy.getBoundingClientRect(); jset(ev.clientX - r.left - r.width / 2, ev.clientY - r.top - r.height / 2); });
            joy.addEventListener('pointermove', ev => { if (ev.pointerId !== jid) return; const r = joy.getBoundingClientRect(); jset(ev.clientX - r.left - r.width / 2, ev.clientY - r.top - r.height / 2); });
            const jend = ev => { if (ev.pointerId !== jid) return; jid = null; jset(0, 0); };
            joy.addEventListener('pointerup', jend); joy.addEventListener('pointercancel', jend);
            // klavye
            document.addEventListener('keydown', ev => {
                if (ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
                const c = ev.code;
                if (c === 'Escape' && $('#su-time').classList.contains('show')) { $('#su-time').classList.remove('show'); return; }
                if (c === 'Escape') { if ($('#su-confirm').classList.contains('show')) closeConfirm(); else if ($('#su-viewer').classList.contains('show')) closeViewer(); else if ($('#su-coll').classList.contains('show') || $('#su-map').classList.contains('show') || $('#su-import').classList.contains('open')) closeModals(); else if (insp.e) closeInspect(); else if (tour.active) exitTour(); }
                else if (ev.repeat) return;
                else if (c === 'KeyT') tour.active ? exitTour() : startTour(false);
                else if (c === 'KeyK') $('#su-coll').classList.contains('show') ? closeModals() : openColl();
                else if (c === 'KeyM') $('#su-map').classList.contains('show') ? closeModals() : openMap(insp.e);
                else if (c === 'KeyI') $('#su-b-imp').click();
                else if (c === 'KeyH') toggleHidden();
                else if (c === 'KeyN') setTimeout(setDayIcon, 0);
                else if (tour.active && !insp.e && c === 'Space') { ev.preventDefault(); setPaused(!tour.paused); }
                else if (tour.active && !insp.e && c === 'ArrowRight' && tour.paused) beginShot(tour.idx + 1);
                else if (tour.active && !insp.e && c === 'ArrowLeft' && tour.paused) beginShot(tour.idx - 1);
            });
            window.addEventListener('resize', () => { if ($('#su-map').classList.contains('show')) { const r = mapRect(); Object.assign(ATLAS.rect, r); const cv = $('#su-mapcv'), dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = r.w * dpr; cv.height = r.h * dpr; } if ($('#su-viewer').classList.contains('show')) viewerPZ.fit(24); });
        }
        function toggleHidden() {
            ui.classList.toggle('hidden');
            if (ui.classList.contains('hidden')) toast('Arayüz gizlendi. Geri getirmek için H tuşuna bas ya da sağ üstteki “Arayüzü göster” düğmesine dokun.');
        }
        function applyTransform(a) {
            const st = a.rec.settings, sc = a.norm * st.scale;
            a.objs.forEach(o => { o.scale.setScalar(sc); o.rotation.y = st.rot; o.position.set(st.x, DECK + st.y - a.minY * sc, st.z); });
            a.birds.forEach(b => { b.obj.scale.setScalar(sc); b.foot = -a.minY * sc; b.yaw0 = (b.slot.perch.yaw || 0) + st.rot; });
        }

        // ---------------------- MOTOR KÖPRÜSÜ ----------------------
        api.init = function () {
            BUILDINGS.forEach((e, i) => { e.id = 'SU-' + String(i + 1).padStart(4, '0'); e.mesh.userData.buildingId = e.id; byId.set(e.id, e); });
            buildDOM(); wire(); setDayIcon();
            loadCollection(); loadDiscovery(); refreshColl(); renderAssets(); refreshStatus(true);
            restoreAssets();
            api.ready = true;
            window.SU_CITY = { buildings: BUILDINGS, getMetadata: id => byId.has(id) ? metadata(byId.get(id)) : null, collection: () => collection.slice(), mintIntegrationPoint: api.mintIntegrationPoint };
        };
        api.pick = function (mesh) {
            if (!mesh) { if (insp.e) closeInspect(); return; }
            const e = mesh.userData.entry; if (e) openInspect(e);
        };
        api.onDrag = function (dx, dy) {
            if (insp.e) { insp.auto = false; insp.tAz += dx * 0.006; insp.tEl = clamp(insp.tEl + dy * 0.005, 0.02, 1.45); return true; }
            if (tour.active) {
                if (!tour.paused) setPaused(true);
                const o = tour.orbit; o.az += dx * 0.006; o.el = clamp(o.el + dy * 0.005, 0.02, 1.45); tour.moved = true; return true;
            }
            return false;
        };
        api.onZoom = function (deltaY) {
            if (insp.e) { const D = fitDist(geom(insp.e), 50); insp.tDist = clamp(insp.tDist * (1 + deltaY * 0.0011), D * 0.3, D * 4); return true; }
            if (tour.active) { if (!tour.paused) setPaused(true); tour.orbit.dist = clamp(tour.orbit.dist * (1 + deltaY * 0.0011), 6, 1500); return true; }
            return false;
        };
        api.isOverriding = () => !!(insp.e || tour.active);
        api.update = function (dt) {
            const joy = $('#su-joy'); if (joy) joy.style.visibility = (insp.e || tour.active) ? 'hidden' : '';
            if (insp.e && !isDiscovered(insp.e)) {
                insp.dwell += dt;
                if (insp.dwell >= DWELL) markDiscovered(insp.e, 'inspect');
                updateDiscRing();
            }
            if (insp.e) { FOCUS.center.copy(geom(insp.e).center); FOCUS.radius = geom(insp.e).R * 1.05; FOCUS.goal = 0.75; } else if (!tour.active) FOCUS.goal = 0;
            if (!insp.e && !tour.active) { CUT.on.value = 0; if (viewOff.x || viewOff.y) { applyViewOffset(dt); } return false; }
            camera.up.set(0, 1, 0);
            if (insp.e) updateInspect(dt); else updateTour(dt);
            applyViewOffset(dt);
            // seçili binanın önüne hiçbir şey geçmesin: kamera ile bina arasındaki tüm diğer binalar/çatılar/köprüler kesilir
            const ce = insp.e || (tour.active && tour.phase === 'present' ? tour.list[tour.idx] : null);
            if (ce) {
                const g = geom(ce); _v.copy(camera.position).sub(g.center); const L = _v.length();
                if (L > g.R + 2) { CUT.on.value = 1; CUT.a.value.copy(camera.position); CUT.b.value.copy(g.center).addScaledVector(_v, (g.R + 1.2) / L); CUT.r.value = g.R * 1.2 + 2; }
                else CUT.on.value = 0;
            } else CUT.on.value = 0;
            return true;
        };
        // uyarlanabilir performans: kare süresine göre piksel yoğunluğu ve yansıma çözünürlüğü
        const perf = { acc: 0, n: 0, t: 0, prMax: 0, cool: 0 };
        let viewerT = 0;
        api.frame = function (dt) {
            updateWalkDiscovery(dt);
            {
                let fe = null, fp = 0; const te = tour.active ? tour.list[tour.idx] : null;
                if (insp.e && !isDiscovered(insp.e)) { fe = insp.e; fp = insp.dwell / DWELL; }
                else if (te && tour.phase === 'present' && !isDiscovered(te)) { fe = te; fp = tour.t / SHOT; }
                // v4 · yürürken ruh hiçbir binaya ışık uzatmaz/düşürmez: yürüyüşte cephe dolumu ve ışık bağı yok
                AWAKE.focus(fe, fp);
                AWAKE.setTether(null, 0, 0);
            }
            drawMini(dt);
            if ($('#su-map').classList.contains('show')) { Object.assign(ATLAS.rect, mapRect()); drawMap(); }
            statusT += dt; if (statusT > 0.4) { statusT = 0; refreshStatus(); refreshGuide(); }
            tpT += dt; if (tpT > 0.2) { tpT = 0; updateTimePanel(); }
            if (viewerEntry && $('#su-viewer').classList.contains('show')) { viewerT += dt; if (viewerT >= 2) markDiscovered(viewerEntry, 'art'); } else viewerT = 0;
            // uyarlanabilir kalite artık motor tarafındaki GOV yöneticisinde (kare süresi dağılımı + 30 Hz kilidi + geri alınabilir kademe yığını)
        };
        api.openInspect = id => openInspect(byId.get(id));
        api.addToCollection = id => addColl(byId.get(id));
        api.removeFromCollection = id => removeColl(byId.get(id));
        api.collection = () => collection.slice();
        api.startTour = startTour; api.exitTour = exitTour; api.setPaused = setPaused; api.next = () => beginShot(tour.idx + 1); api.prev = () => beginShot(tour.idx - 1);
        api.tourState = () => ({ active: tour.active, paused: tour.paused, idx: tour.idx, t: tour.t, phase: tour.phase, total: tour.list.length, current: tour.list[tour.idx] && tour.list[tour.idx].id });
        api.discovered = () => [...discovered]; api.discoveryHistory = () => discHistory.slice(); api.stateOf = id => stateOf(byId.get(id));
        api.shotKeys = id => shotPlan(byId.get(id)).keys.map(k => ({ t: k.t, el: k.el, dist: k.dist }));
        api.openViewer = id => openViewer(byId.get(id)); api.openMap = openMap; api.openColl = openColl; api.importFiles = importFiles; api.assets = () => assets.map(a => ({ id: a.id, mode: a.rec.settings.mode, birds: a.birds.length, objs: a.objs.length, spirit: !!a.isSpirit }));
        api.metadata = id => metadata(byId.get(id)); api.closeInspect = closeInspect;
        api.mapScreenPoint = id => { const g = geom(byId.get(id)), r = ATLAS.rect; atlasPose(); const p = project(g.cx, g.top * 0.5, g.cz, r); return p ? { x: r.x + p.x, y: r.y + p.y } : null; };
        api.mapMode = () => MAPCAM.mode;
        api.teleport = (x, z) => teleport(x, z); api.route = () => ({ active: ROUTE.active, len: ROUTE.S.length ? ROUTE.S[ROUTE.S.length - 1] : 0, prog: ROUTE.prog, covered: ROUTE.keyIdx, total: ROUTE.total });
        api.onFast = () => {};
        api.toggleGuide = () => toggleGuide(); api.walkProgress = () => ({ target: WALK.target && WALK.target.id, prog: WALK.target ? (WALK.prog.get(WALK.target.id) || 0) : 0 });
        return api;
    })();
    window.SU = SU;
    </script>
